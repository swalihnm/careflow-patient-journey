[project]
name = "careflow"
version = "0.1.0"
description = "CareFlow: Patient Journey Intelligence Platform (portfolio demo, not a medical product)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "fhir.resources>=7.1.0",
    "trustcore",
    "specmcp",
]

[tool.uv.sources]
trustcore = { workspace = true }
specmcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Editable-installs the root project so `hie` (and other app-level packages
# added in later phases) import cleanly from anywhere, not just scripts run
# from the repo root. `fhir/` is deliberately excluded -- see the note in
# fhir/seed/enrich_arabic.py about the fhir.resources namespace collision.
packages = ["hie", "ml", "safety", "qa", "rag", "assistant", "apps/api"]

[project.optional-dependencies]
assistant = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
    "langdetect>=1.0.9",
    "litellm>=1.50",
]
ml = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "fairlearn>=0.11",
    "mlflow>=2.16",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "joblib>=1.4",
]
safety = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # Declared as a real dependency (not a one-off `spacy download`) so it
    # survives `uv sync` instead of being pruned as extraneous each time.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]
e2e = [
    # SPEC 11's Playwright acceptance criteria (tests/e2e/), driving the two
    # real Next.js apps (apps/care-web, apps/patient-web) against the real
    # FastAPI backend -- browser binary via `uv run playwright install chromium`.
    "pytest-playwright>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 (no function calls in argument defaults) is a false positive for
# FastAPI's Depends()/Header()/Query() pattern -- that's the framework's
# documented, required way to declare dependencies, not a mutable-default
# bug the rule is meant to catch.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: the conversation eval set (120 live multi-turn scenarios, SPEC 11) -- skip with -m 'not slow' for a fast local loop",
]
