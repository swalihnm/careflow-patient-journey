[project]
name = "trustcore"
version = "0.1.0"
description = "Tamper-evident audit hash chain (minimal, built fresh for CareFlow Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trustcore"]
