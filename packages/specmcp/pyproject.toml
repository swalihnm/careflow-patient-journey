[project]
name = "specmcp"
version = "0.1.0"
description = "Turns a curated OpenAPI spec + a policy YAML into a policy-controlled, audited tool layer (minimal, built fresh for CareFlow Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "trustcore",
]

[tool.uv.sources]
trustcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specmcp"]
