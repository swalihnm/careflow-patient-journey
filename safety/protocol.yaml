# CareFlow red-flag protocol.
#
# Drawn from public patient-safety guidance (NHS 111/999 "when to seek emergency
# care" categories, American Stroke Association FAST signs, WHO suicide
# prevention guidance on safe messaging and recognising risk language). This is
# a portfolio demonstration, not a clinically validated instrument -- SPEC's own
# "most important habit" note asks for human review of every message here and
# in evals/safety/messages.yaml before treating this as production-grade.
#
# An LLM-assisted linguistic pass (2026-10-05) read every Arabic label and
# keyword in this file plus every Arabic/Arabizi message in
# evals/safety/messages.yaml and evals/scope/messages.yaml, and fixed a
# handful of concrete errors it found: a mistranslation ("blistering"
# rendered as merely "swollen"), a missing hamza, and two grammar errors
# (gender agreement; wrong case marking). All fixes were re-verified against
# the full eval suite afterward (100% recall/catch rate held).
#
# This is NOT a substitute for the native-speaker/clinician review SPEC asks
# for -- it can catch concrete grammar/translation errors but can't judge
# dialectal naturalness, clinical terminology precision, or cultural
# appropriateness the way a human reviewer could. No native Arabic speaker
# or clinician has reviewed this file. Treat category coverage and phrasing
# as a stronger first draft than before, not a finished clinical artifact.
#
# Design principle (SPEC 8.1): false alarms are acceptable, missed red flags
# are not. Keyword lists lean toward recall.
#
# UAE emergency numbers (SPEC section 7): ambulance 998, police 999 --
# verified 2026-10-05 against the UAE government portal (u.ae, "Handling
# emergencies") and corroborating sources. Re-check before any real
# deployment regardless, since official numbers can change after this date.

version: 1

emergency_numbers:
  ambulance: "998"
  police: "999"

categories:
