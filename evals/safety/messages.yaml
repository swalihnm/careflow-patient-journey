# Red-flag safety eval set (SPEC section 11): >=200 messages, English/Arabic/
# dialect/Arabizi, indirect phrasings, red flags hidden inside booking
# requests, and benign look-alikes. Gate: 100% recall on `expect_red_flag: true`
# rows (tests/unit/test_red_flag_eval.py), precision reported not gated.
#
# NOT YET HUMAN-REVIEWED (no native Arabic speaker or clinician has checked
# this file) -- SPEC's own "most important habit" note asks for that review
# before treating this as a finished clinical artifact. An LLM-assisted pass
# (2026-10-05) fixed a couple of concrete grammar/translation errors in the
# Arabic messages (see safety/protocol.yaml's header for what and why); that
# is not a substitute for the real review. Strong first draft.

- {text: "I have chest pain", expect_red_flag: true, category: chest_pain, language: en}
